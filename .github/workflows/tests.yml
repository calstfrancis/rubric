name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version / metainfo consistency
        run: ./check-versions.sh

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uses the runner's system Python (no actions/setup-python) so the
      # apt-installed PyGObject bindings below are actually importable —
      # setup-python's isolated interpreter can't see system dist-packages
      # (same gotcha the gtk-panels job below already works around). Needed
      # here too because `tests/` discovery pulls in rubric.py and
      # bulletin_exporter.py, which import gi, even though most of this
      # job's own tests don't touch GTK.
      - name: Install GTK4/libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Run backend/data-layer tests
        run: |
          python3 -m unittest test_rcl_data test_bible_api test_snippets -v
          python3 -m unittest discover -s tests -v

  gtk-panels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uses the runner's system Python (no actions/setup-python) so the
      # apt-installed PyGObject bindings below are actually importable —
      # setup-python's isolated interpreter can't see system dist-packages.
      - name: Install GTK4/libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 xvfb

      - name: Verify GTK4/libadwaita import before running tests
        run: |
          python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); from gi.repository import Gtk, Adw; print('GTK4/libadwaita import OK')"

      - name: Run panel/exporter tests
        run: |
          # test_hymn_lookup belongs here, not in the backend job: hymn_lookup
          # imports gi, which the setup-python interpreter there cannot see.
          xvfb-run -a python3 -m unittest tests.test_panels test_hymn_lookup -v
